<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roge">
<title>IST-LEISTUNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
--navy: #0b0906;
--navy-panel: #1c160f;
--amber: #7a1f16;
--amber-dim: #4a2a20;
--teal: #c9bfa8;
--teal-dim: #8a8070;
--red: #8a2418;
--text-lo: #b8ada0;
--hairline: rgba(120, 100, 70, 0.28);
--brass-lt: #58564f;
--brass-dk: #0f0e0c;
--font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
--font-display: 'Oswald', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background:#0b0906; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
background: radial-gradient(ellipse at center, #14100b 0%, #0b0906 70%, #030202 100%);
display:flex; align-items:center; justify-content:center;
padding-top: env(safe-area-inset-top,0px);
padding-bottom: env(safe-area-inset-bottom,0px);
position:fixed; inset:0; height:auto;
}
.instrument-wrap {
position: relative;
width: min(92vmin, 720px);
height: min(92vmin, 720px);
}
.instrument-wrap::before {
content: "";
position: absolute;
inset: 2%;
border-radius: 50%;
box-shadow: 0 0 20px rgba(0,0,0,0.5);
z-index: -1;
}
svg { width:100%; height:100%; display:block; }

.backlight {
position: fixed;
inset: 0;
background: rgba(232,197,112,0.25);
z-index: 0;
pointer-events: none;
}
.instrument-wrap { z-index: 1; }

.seg { fill: #ece4d0; opacity: 0; }
.seg.lit { opacity: 1; fill: #f6f0df; }

.hdrcol {
position: fixed; display: flex; flex-direction: column; justify-content: space-between;
align-items: center; box-sizing: border-box; pointer-events: none;
font-family: var(--font-mono);
}
.hdrcol .r1 { height: 11px; }
.hdrcol .r2 { height: 11px; }
.hdrcol .r3 { height: 15px; }
.hdrcol .r1, .hdrcol .r2, .hdrcol .r3 { display: flex; align-items: center; justify-content: center; white-space: nowrap; line-height: 1; }
#hdrRight {
top: calc(28px - var(--lift, 0px) + env(safe-area-inset-top, 0px)); right: 10px; height: 41px; align-items: flex-end; color: #f0e6d2;
}
#hdrRight .r1, #hdrRight .r2, #hdrRight .r3 { justify-content: flex-end; }
#hdrRight .r1 { gap: 6px; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; opacity: 0.95; }
#hdrRight .r2 { font-size: 10.5px; letter-spacing: 0.08em; opacity: 0.85; }
#hdrRight .r3 { font-size: 12px; letter-spacing: 0.04em; opacity: 0.95; }
#hdrRight.stale .r2, #hdrRight.stale .r3 { color: #ff6b5a; opacity: 1; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #6b5238; }
.dot.live { background: #e8c570; animation: none; box-shadow: 0 0 4px #e8c570; }
.dot.demo { background: #6b5238; animation: blink 1.4s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }

#maxBox { opacity: 0; display: flex; }
#maxBox .mlabel { font-size: 10px; letter-spacing: 0.05em; font-weight: 700; color: #9cc6f7; }
#maxBox .mtime { font-size: 10.5px; letter-spacing: 0.08em; color: #cfe0f5; }
#maxBox .mval { font-size: 15px; letter-spacing: 0.04em; font-weight: 700; color: #7db4f7; }



.windbox {
position: fixed;
top: calc(28px - var(--lift, 0px) + env(safe-area-inset-top, 0px));
left: 6px;
display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
padding: 4px 6px 4px 6px;
background: rgba(5,9,15,0.6);
border-radius: 3px;
}
.windbox .windlabel {
font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em;
color: #8fe8d8; opacity: 0.85;
}
.windbox svg { display: block; }

/* HUD corner-bracket frame (windbox is already position:fixed, which also
serves as the containing block for these absolutely-positioned corners) */
.hudFrame::before, .hudFrame::after,
.hudFrame .hc1, .hudFrame .hc2 {
content: ""; position: absolute; width: 8px; height: 8px;
border: 1.4px solid #6fe3d0; opacity: 0.85;
}
.hudFrame::before { top: 0; left: 0; border-right: none; border-bottom: none; }
.hudFrame::after { bottom: 0; right: 0; border-left: none; border-top: none; }
.hudFrame .hc1 { top: 0; right: 0; border-left: none; border-bottom: none; }
.hudFrame .hc2 { bottom: 0; left: 0; border-right: none; border-top: none; }


/* Meldungen: Alarme (rot) und Warnungen (gelb) unter dem Instrument */
#alarmBox {
position: fixed; left: 12px; right: 12px; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
display: none; flex-direction: column; gap: 3px; font-family: var(--font-mono); font-size: 10.5px;
color: #ffe3de; pointer-events: none;
}
.alr { display: flex; align-items: center; gap: 7px; padding: 5px 8px; background: rgba(120,20,15,0.6);
border-left: 3px solid #ff4a3a; border-radius: 2px; white-space: nowrap; overflow: hidden; }
.alr .adot { width: 7px; height: 7px; border-radius: 50%; background: #ff4a3a; flex: none; }
.alr b { letter-spacing: 0.06em; color: #fff; flex: none; }
.alr .amsg { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.alr.warn { background: rgba(110,72,8,0.6); border-left-color: #ffb02e; color: #fff0d0; }
.alr.warn .adot { background: #ffb02e; }
.alr.more { background: none; border-left-color: transparent; justify-content: center; opacity: 0.8; padding: 0; }

/* Vergleich Langendorf gegen Roge (Leuchtbalken, Nixie-Stil) zwischen Kopfzeile und Zifferblatt */
#vsBox {
position: fixed; left: 50%; transform: translateX(-50%); top: 0; display: none; z-index: 2;
background: #0a0807; border: 0.5px solid #2a1d14; border-radius: 8px; padding: 8px 12px 9px;
font-family: var(--font-mono); pointer-events: none;
}
.vrow { display: flex; align-items: flex-end; gap: 8px; }
.vrow + .vrow { margin-top: 5px; }
.vlbl { font-size: 11px; letter-spacing: 0.1em; color: #c9a47a; width: 82px; flex: none; line-height: 1; }
.vtr { flex: 1; min-width: 0; margin-right: 18px; position: relative; padding-top: 15px; }
.vseg { display: flex; gap: 2px; height: 10px; }
.vseg i { display: block; flex: 1; border-radius: 1px; background: #2a1d14; }
.vseg i.on { background: #ff9a3c; box-shadow: 0 0 3px #ff7a1a; }
.vseg i.dm { background: #a8662c; }
.vpc { position: absolute; top: 0; font-size: 13px; font-weight: 500; line-height: 14px; transform: translateX(-50%); white-space: nowrap; }
.vpc.on { color: #ffa23f; text-shadow: 0 0 6px #ff7a1a; }
.vpc.dm { color: #a8662c; text-shadow: 0 0 4px #7a3a0a; }
#vsBox.tight { padding: 6px 10px 7px; }
#vsBox.tight .vrow + .vrow { margin-top: 3px; }
#vsBox.tight .vtr { padding-top: 13px; }
#vsBox.tight .vseg { height: 8px; }
#vsBox.tight .vpc { font-size: 12px; line-height: 12px; }
</style>
</head>

<script>
(function () {
const STORAGE_KEY = 'leistungsanzeige_endpoint';
// Nur auf dem iPad (Bildschirm mind. 700 px, auch im Split View): Kopfzeile und Vergleichszeile 7 px nach oben
const LIFT = Math.min(screen.width, screen.height) >= 700 ? 7 : 0;
document.documentElement.style.setProperty('--lift', LIFT + 'px');
const NS = 'http://www.w3.org/2000/svg';
const CX = 200, CY = 200;
const START_ANGLE = -130, END_ANGLE = 130, SWEEP = END_ANGLE - START_ANGLE;
const MAX_MW = 15, RATED_MW = 6.2;

function polar(r, angleDeg) {
const a = (angleDeg - 0) * Math.PI / 180;
return { x: CX + r * Math.sin(a), y: CY - r * Math.cos(a) };
}
function valueToAngle(mw) {
const clamped = Math.max(0, Math.min(MAX_MW, mw));
return START_ANGLE + (clamped / MAX_MW) * SWEEP;
}

// Rivets
const rivetsG = document.getElementById('rivets');
for (let i = 0; i < 12; i++) {
if (i === 11 || i === 0 || i === 1 || i === 5 || i === 6 || i === 7) continue; // Nieten unter den Schriftzügen oben/unten entfernt
const ang = (360 / 12) * i;
const p = polar(188, ang);
const c = document.createElementNS(NS, 'circle');
c.setAttribute('cx', p.x.toFixed(1));
c.setAttribute('cy', p.y.toFixed(1));
c.setAttribute('r', '3');
c.setAttribute('fill', '#1c1a16');
c.setAttribute('stroke', '#7a766c');
c.setAttribute('stroke-width', '0.6');
rivetsG.appendChild(c);
}

// Colour zone arc (teal -> amber -> red)
function arcPath(r, a1, a2) {
const p1 = polar(r, a1), p2 = polar(r, a2);
const large = (a2 - a1) > 180 ? 1 : 0;
return 'M ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
}
const zoneG = document.getElementById('zoneArc');
const zones = [];
zones.forEach(function (z) {
const path = document.createElementNS(NS, 'path');
path.setAttribute('d', arcPath(163, valueToAngle(z.from), valueToAngle(z.to)));
path.setAttribute('fill', 'none');
path.setAttribute('stroke', z.color);
path.setAttribute('stroke-width', '6');
path.setAttribute('opacity', '0.55');
zoneG.appendChild(path);
});

// Ticks + labels
const ticksG = document.getElementById('ticks');
const labelsG = document.getElementById('tickLabels');
const MAJOR_STEP = 1, MINOR_STEP = 0.5;
for (let mw = 0; mw <= MAX_MW + 0.001; mw += MINOR_STEP) {
const isMajor = Math.abs(mw / MAJOR_STEP - Math.round(mw / MAJOR_STEP)) < 0.001;
const ang = valueToAngle(mw);
const p1 = polar(isMajor ? 150 : 156, ang);
const p2 = polar(172, ang);
const line = document.createElementNS(NS, 'line');
line.setAttribute('x1', p1.x.toFixed(1)); line.setAttribute('y1', p1.y.toFixed(1));
line.setAttribute('x2', p2.x.toFixed(1)); line.setAttribute('y2', p2.y.toFixed(1));
line.setAttribute('stroke', isMajor ? '#ece4d0' : '#8a8070');
line.setAttribute('stroke-width', isMajor ? '2.4' : '1');
line.setAttribute('opacity', isMajor ? '0.95' : '0.5');
ticksG.appendChild(line);
if (isMajor) {
const lp = polar(132, ang);
const t = document.createElementNS(NS, 'text');
t.setAttribute('x', lp.x.toFixed(1)); t.setAttribute('y', (lp.y + 5).toFixed(1));
t.setAttribute('text-anchor', 'middle');
t.setAttribute('font-family', 'IBM Plex Mono');
t.setAttribute('font-size', '13');
t.setAttribute('fill', '#ece4d0');
t.textContent = String(Math.round(mw));
labelsG.appendChild(t);
} else {
const lp = polar(120, ang);
const t = document.createElementNS(NS, 'text');
t.setAttribute('x', lp.x.toFixed(1)); t.setAttribute('y', (lp.y + 3).toFixed(1));
t.setAttribute('text-anchor', 'middle');
t.setAttribute('font-family', 'IBM Plex Mono');
t.setAttribute('font-size', '8');
t.setAttribute('fill', '#b8ada0');
t.textContent = mw.toFixed(1);
labelsG.appendChild(t);
}
}

// 7-segment digital readout for kW value
const SEG_MAP = {
'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc',
'5':'afgcd','6':'afgecd','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''
};
function segRects(w, h, t) {
return {
a:[t*0.6,0,w-t*1.2,t], g:[t*0.6,h/2-t/2,w-t*1.2,t], d:[t*0.6,h-t,w-t*1.2,t],
f:[0,t*0.6,t,h/2-t*0.9], b:[w-t,t*0.6,t,h/2-t*0.9],
e:[0,h/2+t*0.3,t,h/2-t*0.9], c:[w-t,h/2+t*0.3,t,h/2-t*0.9]
};
}
function drawDigit(svg, xOffset, ch, scale) {
const w=34*scale, h=40*scale, t=6*scale;
const rects = segRects(w,h,t);
const active = SEG_MAP[ch] || '';
Object.keys(rects).forEach(function(key){
const r = rects[key];
const rect = document.createElementNS(NS,'rect');
rect.setAttribute('x',(xOffset+r[0]).toFixed(1));
rect.setAttribute('y',r[1].toFixed(1));
rect.setAttribute('width',r[2].toFixed(1));
rect.setAttribute('height',r[3].toFixed(1));
rect.setAttribute('rx',(t*0.35).toFixed(1));
rect.setAttribute('class','seg'+(active.indexOf(key)>-1?' lit':''));
svg.appendChild(rect);
});
return w;
}
function drawSep(svg, xOffset, scale, h) {
const size = 6*scale*0.9;
const rect = document.createElementNS(NS,'rect');
rect.setAttribute('x',xOffset.toFixed(1));
rect.setAttribute('y',(h-size).toFixed(1));
rect.setAttribute('width',size.toFixed(1));
rect.setAttribute('height',size.toFixed(1));
rect.setAttribute('class','seg lit');
svg.appendChild(rect);
return size+4*scale;
}
function renderKwDigits(display) {
const svg = document.getElementById('digitalKw');
while (svg.firstChild) svg.removeChild(svg.firstChild);
const KW_SCALE = 1.2;
const h = 24 * KW_SCALE;
let x = 0;
for (let i=0;i<display.length;i++){
const ch = display[i];
if (ch==='.') { x += drawYieldSep(svg,x,ch,h) + 2; }
else { x += drawYieldDigit(svg,x,ch,KW_SCALE) + 3 * KW_SCALE; }
}
// im Fenster (x118-282, y238-294) zentrieren, Einheit "kW" mit einrechnen
const windowLeft = 118, windowWidth = 164, windowTop = 238;
const unitWidth = 17;
const totalWidth = x + 4 + unitWidth;
const startX = windowLeft + (windowWidth - totalWidth) / 2;
const startY = windowTop + 8;
svg.setAttribute('transform', 'translate(' + startX.toFixed(1) + ',' + startY.toFixed(1) + ')');
const unit = document.getElementById('kwUnit');
unit.setAttribute('x', (startX + x + 4).toFixed(1));
unit.setAttribute('y', (startY + h - 2).toFixed(1));
unit.textContent = 'kW';
}

// Sehr kleine LEDs entlang des schmalen inneren Rings, 0-12 MW in 0,1-MW-Schritten
// (echte 1-kW-Auflösung = 12.000 LEDs ließe sich auf diesem Ring nicht überlappungsfrei
// darstellen, daher die feinste praktikable Auflösung von 100 kW pro LED)
const ledG = document.getElementById('ledRing');
const LED_STEP = 0.1;
const leds = [];
for (let mw = 0; mw <= MAX_MW + 0.001; mw += LED_STEP) {
const p = polar(178, valueToAngle(mw));
const c = document.createElementNS(NS, 'circle');
c.setAttribute('cx', p.x.toFixed(2));
c.setAttribute('cy', p.y.toFixed(2));
c.setAttribute('r', '1');
c.setAttribute('fill', '#3a352c');
ledG.appendChild(c);
leds.push(c);
}
function updateLeds(mw) {
const litCount = Math.round(Math.min(MAX_MW, Math.max(0, mw)) / LED_STEP);
leds.forEach(function (c, i) {
c.setAttribute('fill', i <= litCount ? '#f3e2b8' : '#3a352c');
c.setAttribute('opacity', i <= litCount ? '1' : '0.5');
});
}

// 7-segment renderer for the Gesamtertrag row (kleinere, eigene Maße)
function drawYieldDigit(svg, xOffset, ch, scale) {
scale = scale || 1;
const w = 13 * scale, h = 24 * scale, t = 3 * scale;
const rects = segRects(w, h, t);
const active = SEG_MAP[ch] || '';
Object.keys(rects).forEach(function (key) {
const r = rects[key];
const rect = document.createElementNS(NS, 'rect');
rect.setAttribute('x', (xOffset + r[0]).toFixed(1));
rect.setAttribute('y', r[1].toFixed(1));
rect.setAttribute('width', r[2].toFixed(1));
rect.setAttribute('height', r[3].toFixed(1));
rect.setAttribute('rx', (t * 0.35).toFixed(1));
rect.setAttribute('class', 'seg' + (active.indexOf(key) > -1 ? ' lit' : ''));
svg.appendChild(rect);
});
return w;
}
function drawYieldSep(svg, xOffset, kind, h) {
const size = 4.4;
if (kind === ',') {
const s = size;
const poly = document.createElementNS(NS, 'polygon');
const pts = [
(xOffset + s * 0.95).toFixed(2) + ',' + (h - s * 0.55).toFixed(2),
(xOffset + s * 0.4).toFixed(2) + ',' + (h - s * 0.55).toFixed(2),
(xOffset - s * 0.15).toFixed(2) + ',' + (h + s * 1.45).toFixed(2)
].join(' ');
poly.setAttribute('points', pts);
poly.setAttribute('class', 'seg lit');
svg.appendChild(poly);
return size + 2.6;
}
const rect = document.createElementNS(NS, 'rect');
rect.setAttribute('x', xOffset.toFixed(1));
rect.setAttribute('y', (h - size).toFixed(1));
rect.setAttribute('width', size.toFixed(1));
rect.setAttribute('height', size.toFixed(1));
rect.setAttribute('rx', (size * 0.3).toFixed(1));
rect.setAttribute('class', 'seg lit');
svg.appendChild(rect);
return size + 2.6;
}
// Format: 9 Ziffern -> XXX.XXX,XXX (Tausendertrenner nach Stelle 3, Komma nach Stelle 6)
function formatYield(mwh) {
const clampedWhole = Math.max(0, Math.min(999999, Math.floor(mwh)));
let decimals = Math.round((mwh - Math.floor(mwh)) * 1000);
if (decimals >= 1000) decimals = 999;
const wholeStr = String(clampedWhole).padStart(6, '0');
const decStr = String(decimals).padStart(3, '0');
return wholeStr.slice(0, 3) + '.' + wholeStr.slice(3, 6) + ',' + decStr;
}
function renderYieldDigits(display) {
const svg = document.getElementById('digitalYield');
while (svg.firstChild) svg.removeChild(svg.firstChild);
const h = 24;
let x = 0;
for (let i = 0; i < display.length; i++) {
const ch = display[i];
if (ch === '.' || ch === ',') {
x += drawYieldSep(svg, x, ch, h) + 2;
} else {
x += drawYieldDigit(svg, x, ch) + 3;
}
}
// gesamten Block innerhalb des Fensters (x 110-290, y 300-344) horizontal zentrieren
const windowLeft = 110, windowWidth = 180, windowTop = 300, padY = 4;
const startX = windowLeft + (windowWidth - x) / 2;
svg.setAttribute('transform', 'translate(' + startX.toFixed(1) + ',' + (windowTop + padY).toFixed(1) + ')');
const unit = document.getElementById('yieldUnit');
unit.setAttribute('x', (windowLeft + windowWidth / 2).toFixed(1));
unit.setAttribute('y', (windowTop + padY + h + 16).toFixed(1));
unit.setAttribute('text-anchor', 'middle');
unit.textContent = 'MWh GESAMTERTRAG';
}

// ---- Data binding ----
const needleGroup = document.getElementById('needleGroup');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const mwText = document.getElementById('mwText');
const lastUpdateBox = document.getElementById('lastUpdateBox');

function formatPair(kw) {
const isNegative = kw < 0;
const absKw = Math.min(19999, Math.round(Math.abs(kw)));
const kwStr = (isNegative ? '-' : '') + String(absKw);
const mwValue = (absKw / 1000).toFixed(3);
const mwStr = (isNegative ? '\u2212' : '') + mwValue.replace('.', ',') + ' MW';
return { isNegative, kwStr, mwStr };
}
function setLive(isLive) {
statusDot.className = 'dot ' + (isLive ? 'live' : 'demo');
statusText.textContent = isLive ? 'LIVE' : 'DEMO';
}

let demoKw = 2441, demoDirection = 1;
let currentAngle = START_ANGLE;
let totalYieldMwh = 128456.734;
let lastTickMs = Date.now();

// ---- Meldungen (Alarme und Warnungen) unter dem Instrument ----
const alarmBox = document.getElementById('alarmBox');
const UMLAUT = [['waechter', 'w\u00E4chter'], ['Oel', '\u00D6l'], ['oel', '\u00F6l'], ['Ueber', '\u00DCber'], ['ueber', '\u00FCber']];
function schoen(t) { UMLAUT.forEach(p => { t = t.split(p[0]).join(p[1]); }); return t; }
function renderMeldungen(list, ts) {
if (!Array.isArray(list) || list.length === 0) { alarmBox.textContent = ''; alarmBox.dataset.sig = ''; alarmBox.style.display = 'none'; return; }
const sorted = list.slice().sort((a, b) => (a.typ === b.typ ? 0 : (a.typ === 'alarm' ? -1 : 1)) || String(a.wea).localeCompare(String(b.wea)));
const MAXROWS = 3;
const rows = sorted.length > MAXROWS ? sorted.slice(0, MAXROWS - 1) : sorted;
const sig = JSON.stringify(rows) + sorted.length;
if (alarmBox.dataset.sig !== sig) {
alarmBox.textContent = '';
rows.forEach(a => {
const d = document.createElement('div'); d.className = 'alr' + (a.typ === 'alarm' ? '' : ' warn');
const dot = document.createElement('span'); dot.className = 'adot';
const w = document.createElement('b'); w.textContent = 'WEA ' + a.wea;
const m = document.createElement('span'); m.className = 'amsg'; m.textContent = schoen(String(a.text || ''));
d.append(dot, w, m);
alarmBox.append(d);
});
if (sorted.length > MAXROWS) { const mo = document.createElement('div'); mo.className = 'alr more'; mo.textContent = '+ ' + (sorted.length - rows.length) + ' weitere Meldungen'; alarmBox.append(mo); }
alarmBox.dataset.sig = sig;
}
alarmBox.style.display = 'flex';
alarmBox.style.opacity = (ts && Date.now() - ts > 10 * 60 * 1000) ? '0.45' : '1'; // veraltete Daten blasser
}

// ---- Automatische Erneuerung: holt sich selbst die neueste Version von GitHub ----
const verEl = document.getElementById('verSvg');
const verHit = document.getElementById('verHit');
const MEINE_VERSION = parseInt(((verEl && verEl.textContent) || '').replace(/\D/g, ''), 10) || 0;
function neuLaden() { location.replace(location.pathname + '?neu=' + Date.now()); } // Adresse mit Zusatz umgeht den Zwischenspeicher
async function pruefeNeueVersion() {
try {
const res = await fetch(location.pathname + '?pruefen=' + Date.now(), { cache: 'no-store' });
if (!res.ok) return;
const m = (await res.text()).match(/id="verSvg"[^>]*>v(\d+)</);
if (!m) return;
const neu = parseInt(m[1], 10);
if (neu <= MEINE_VERSION) return;
// Schutz vor Endlosschleife: pro Zielversion hoechstens 3 Versuche pro Stunde
const key = 'neuladen_' + location.pathname;
let st = {}; try { st = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
const jetzt = Date.now();
if (st.v !== neu || jetzt - (st.t0 || 0) > 3600000) st = { v: neu, n: 0, t0: jetzt };
if (st.n >= 3) return;
st.n++; try { localStorage.setItem(key, JSON.stringify(st)); } catch (e) {}
neuLaden();
} catch (e) {}
}
setTimeout(pruefeNeueVersion, 60000);
setInterval(pruefeNeueVersion, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(pruefeNeueVersion, 3000); });
if (verHit) verHit.addEventListener('click', neuLaden); // Notloesung: Versionsnummer antippen = neu laden

// ---- Hinweis bei veralteten Daten: "Stand" wird rot ----
const hdrRight = document.getElementById('hdrRight');
function setStale(s) { hdrRight.classList.toggle('stale', !!s); }

// Rotor in der Nabe: dreht sich schneller, je mehr Leistung
const rotorEl = document.getElementById('rotorBlades');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let rotorAngle = 0, rotorOmega = 0, rotorTarget = 0, rotorLast = 0;
function rotorFrame(ts) {
requestAnimationFrame(rotorFrame);
if (ts - rotorLast < 33) return; // ca. 30 Bilder pro Sekunde
const dt = rotorLast ? Math.min(0.1, (ts - rotorLast) / 1000) : 0.033;
rotorLast = ts;
rotorOmega += (rotorTarget - rotorOmega) * Math.min(1, dt * 1.5);
if (rotorOmega < 0.5) return;
rotorAngle = (rotorAngle + rotorOmega * dt) % 360;
rotorEl.setAttribute('transform', 'rotate(' + rotorAngle.toFixed(1) + ')');
}
if (!reduceMotion) requestAnimationFrame(rotorFrame);
function setRotorPower(kw) {
rotorTarget = kw < 15 ? 0 : 0.49 * (25 + 335 * Math.sqrt(Math.min(1, kw / (MAX_MW * 1000))));
}

// Anzeigefeld "Tagesmaximum-Einspeisung" (Kopfzeile, zwischen Windfeld und Stand)
const maxBox = document.getElementById('maxBox');
function showMaxField(v, ts) {
document.getElementById('maxVal').textContent = (v / 1000).toFixed(2).replace('.', ',') + ' MW';
document.getElementById('maxTime').textContent = ts ? new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr' : '--:-- Uhr';
maxBox.style.opacity = '1';
layoutMaxBox();
}
function layoutMaxBox() {
const wb = document.querySelector('.windbox').getBoundingClientRect();
const hr = document.getElementById('hdrRight');
hr.style.top = wb.top + 'px'; hr.style.height = wb.height + 'px';
const st = hr.getBoundingClientRect();
const left = wb.right + 10, right = st.left - 10;
if (right - left < 60) { maxBox.style.display = 'none'; return; }
maxBox.style.display = 'flex';
maxBox.style.left = left + 'px';
maxBox.style.width = (right - left) + 'px';
maxBox.style.top = wb.top + 'px';
maxBox.style.height = wb.height + 'px';
// Ueberschrift schrumpft nur dann, wenn der Platz zu schmal wird
const lab = maxBox.querySelector('.mlabel');
lab.style.fontSize = '10px';
const natural = lab.getBoundingClientRect().width;
const avail = right - left - 6;
if (natural > avail) lab.style.fontSize = Math.max(6, 10 * avail / natural).toFixed(2) + 'px';
}
window.addEventListener('resize', layoutMaxBox);
setInterval(layoutMaxBox, 5000);

// Tagesspitze: hoechster Wert des Tages als Schleppnadel und Dreieck am Rand
const maxNeedleG = document.getElementById('maxNeedleG');
const maxTriG = document.getElementById('maxTriG');
let dayMaxKw = 0, dayMaxTs = 0;
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
try {
const sv = JSON.parse(localStorage.getItem('dayMaxKw_roge') || 'null');
if (sv && sv.d === todayKey() && sv.kw > 0) { dayMaxKw = sv.kw; dayMaxTs = sv.t || 0; }
} catch (e) {}
let dayMaxDate = todayKey();
function updateDayMax(kw) {
const t = todayKey();
if (t !== dayMaxDate) { dayMaxDate = t; dayMaxKw = 0; dayMaxTs = 0; }
if (kw > dayMaxKw) {
dayMaxKw = kw; dayMaxTs = Date.now();
try { localStorage.setItem('dayMaxKw_roge', JSON.stringify({ d: t, kw: kw, t: dayMaxTs })); } catch (e) {}
}
drawDayMax(dayMaxKw, dayMaxTs);
}
function drawDayMax(v, ts) {
if (!(v > 0)) return;
showMaxField(v, ts);
const rot = 'rotate(' + valueToAngle(v / 1000).toFixed(2) + ' 200 200)';
maxNeedleG.setAttribute('transform', rot); maxNeedleG.setAttribute('opacity', '1');
maxTriG.setAttribute('transform', rot); maxTriG.setAttribute('opacity', '1');
}
updateDayMax(0);

// Trend: zeigt die Richtung der letzten Aenderung des Live-Werts (Vergleich mit dem Wert davor).
// Der Pfeil bleibt stehen, bis sich der Wert wieder aendert; nach 2 Minuten ohne Aenderung wird er grau.
const TREND_IDLE_MS = 2 * 60 * 1000;
let trendPrevKw = null, trendLastChange = 0, trendShown = null;
function setTrend(el, txt, color, unit) {
el.setAttribute('fill', color);
el.textContent = '';
el.appendChild(document.createTextNode(txt));
const u = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
u.setAttribute('font-size', '8');
u.textContent = ' ' + (unit || 'kW');
el.appendChild(u);
}
function updateTrend(kw) {
const el = document.getElementById('trendText');
if (!el) return;
const now = Date.now();
// Verglichen wird mit dem angezeigten (gerundeten) kW-Wert, damit Pfeil und Anzeige immer zusammenpassen
const kwShown = Math.round(kw);
if (trendPrevKw === null) { trendPrevKw = kwShown; return; }
const diff = kwShown - trendPrevKw;
if (diff !== 0) {
trendPrevKw = kwShown;
trendLastChange = now;
const ad = Math.abs(diff);
const big = ad >= 1000;
const num = big ? (ad / 1000).toFixed(1).replace('.', ',') : String(ad);
const arrow = diff > 0 ? '\u25B2 ' : '\u25BC ';
trendShown = { txt: arrow + num, color: diff > 0 ? '#7be3a0' : '#ff8a70', unit: big ? 'MW' : 'kW' };
setTrend(el, trendShown.txt, trendShown.color, trendShown.unit);
} else if (trendShown && now - trendLastChange > TREND_IDLE_MS && trendShown.txt !== '\u25B6 \u00B10') {
trendShown = { txt: '\u25B6 \u00B10', color: '#9aa', unit: 'kW' };
setTrend(el, trendShown.txt, trendShown.color, trendShown.unit);
}
}

// ---- Vergleich Langendorf gegen Roge: Leistung im Verhaeltnis zur Nennleistung ----
// Nennleistung der Anlagen, die wirklich laufen koennen:
// Langendorf: 7 x 1,5 MW = 10.500 kW (WEA 15 ist defekt). Ist WEA 15 repariert: 12000 eintragen.
// Roge: 8 x 1,8 MW = 14.400 kW
const VS_MY = 'roge';
const VS_NENN_KW = { langendorf: 10500, roge: 14400 };
const VS_OTHER_URL = 'https://api.npoint.io/671e4ab68138cc5a0c82'; // Daten von Langendorf
const VS_SEGS = 30, VS_FRESH_MS = 5 * 60 * 1000;
const vsBox = document.getElementById('vsBox');
const vsMy = { kw: null, ts: 0 }, vsOther = { kw: null, ts: 0 };
let vsLastFetch = 0;
const vsRows = {};
['langendorf', 'roge'].forEach(function (k) {
const row = vsBox.querySelector('[data-k="' + k + '"]');
const seg = row.querySelector('.vseg');
for (let i = 0; i < VS_SEGS; i++) seg.appendChild(document.createElement('i'));
vsRows[k] = { cells: seg.children, pc: row.querySelector('.vpc') };
});
function layoutVs() {
if (vsBox.style.display === 'none') return;
const wb = document.querySelector('.windbox').getBoundingClientRect();
const wr = document.querySelector('.instrument-wrap').getBoundingClientRect();
const hdrBottom = wb.bottom + LIFT; // so rechnen, als waere die Kopfzeile nicht angehoben
const dialTop = wr.top + wr.height * 0.01;
const space = dialTop - hdrBottom;
vsBox.style.width = Math.min(window.innerWidth - 24, wr.width) + 'px';
vsBox.classList.remove('tight');
let h = vsBox.offsetHeight;
if (space < h + 6) { vsBox.classList.add('tight'); h = vsBox.offsetHeight; }
if (space < h + 4) { vsBox.style.display = 'none'; return; } // kein Platz: Zeile weglassen
vsBox.style.top = (hdrBottom + (space - h) / 2 - LIFT).toFixed(1) + 'px'; // um LIFT angehoben, Abstand zur Kopfzeile bleibt gleich
}
function updateVs() {
const now = Date.now();
const ok = vsMy.kw !== null && vsOther.kw !== null && vsMy.ts > 0 && vsOther.ts > 0 &&
now - vsMy.ts < VS_FRESH_MS && now - vsOther.ts < VS_FRESH_MS; // zu alte Daten: Zeile ausblenden
if (!ok) { vsBox.style.display = 'none'; return; }
const kws = {}; kws[VS_MY] = vsMy.kw; kws[VS_MY === 'langendorf' ? 'roge' : 'langendorf'] = vsOther.kw;
const pct = {};
['langendorf', 'roge'].forEach(function (k) { pct[k] = Math.max(0, Math.min(100, kws[k] / VS_NENN_KW[k] * 100)); });
const best = Math.max(Math.round(pct.langendorf), Math.round(pct.roge));
['langendorf', 'roge'].forEach(function (k) {
const p = Math.round(pct[k]);
const cls = p >= best ? 'on' : 'dm'; // wer vorn liegt (oder gleichauf), leuchtet hell
const lit = Math.round(pct[k] / 100 * VS_SEGS);
const r = vsRows[k];
for (let i = 0; i < VS_SEGS; i++) r.cells[i].className = i < lit ? cls : '';
r.pc.textContent = p + '%';
r.pc.className = 'vpc ' + cls;
r.pc.style.left = 'max(14px, ' + pct[k].toFixed(1) + '%)';
});
vsBox.style.display = 'block';
layoutVs();
}
async function holeAnderen() {
const jetzt = Date.now();
if (jetzt - vsLastFetch < 8000) return;
vsLastFetch = jetzt;
try {
const res = await fetch(VS_OTHER_URL, { cache: 'no-store' });
const d = await res.json();
const k = parseFloat(d.leistung_kw);
vsOther.kw = isNaN(k) ? null : k;
vsOther.ts = parseInt(d.ts, 10) || 0;
} catch (e) { vsOther.kw = null; }
updateVs();
}
window.addEventListener('resize', layoutVs);

async function tick() {
const endpoint = localStorage.getItem(STORAGE_KEY) || 'https://api.npoint.io/94769e150c3d88b0650d';
let kw = null;
let liveYieldMwh = null;
let liveWindMs = null;
let serverDayMax = null, serverDayMaxTs = 0;
let liveMeldungen = null, dataTs = 0;
if (endpoint) {
try {
const res = await fetch(endpoint, { cache: 'no-store' });
const data = await res.json();
const raw = parseFloat(data.leistung_kw ?? data.leistung_mw * 1000 ?? data.value ?? data);
if (isNaN(raw)) throw new Error('Ungültige Antwort');
kw = raw;
setLive(true);
if (data.gesamtertrag_mwh !== undefined && data.gesamtertrag_mwh !== null) {
const y = parseFloat(data.gesamtertrag_mwh);
if (!isNaN(y)) liveYieldMwh = y;
}
if (data.wind_ms !== undefined && data.wind_ms !== null) {
const w = parseFloat(data.wind_ms);
if (!isNaN(w)) liveWindMs = w;
}
if (Array.isArray(data.meldungen)) liveMeldungen = data.meldungen;
dataTs = parseInt(data.ts, 10) || 0;
if (data.tagesmax_kw !== undefined && data.tagesmax_kw !== null && data.tagesmax_tag === todayKey()) {
const m = parseFloat(data.tagesmax_kw);
if (!isNaN(m)) { serverDayMax = m; serverDayMaxTs = parseInt(data.tagesmax_ts, 10) || 0; }
}
if (data.ts !== undefined && data.ts !== null) {
const tsNum = parseInt(data.ts, 10);
if (!isNaN(tsNum)) {
lastUpdateBox.textContent = new Date(tsNum).toLocaleTimeString('de-DE');
}
}
} catch (e) { setLive(false); kw = null; }
} else { setLive(false); }

if (liveWindMs !== null && typeof window.setWindText === 'function') {
window.setWindText(liveWindMs.toFixed(1).replace('.', ',') + ' m/s');
}

const isLiveValue = kw !== null;
renderMeldungen(isLiveValue ? liveMeldungen : null, dataTs);
setStale(!isLiveValue || (dataTs > 0 && Date.now() - dataTs > 5 * 60 * 1000));
vsMy.kw = isLiveValue ? kw : null; vsMy.ts = dataTs;
holeAnderen(); updateVs();
if (kw === null) {
demoKw += demoDirection * (Math.random() * 70);
if (demoKw > 14700 || demoKw < -300) demoDirection *= -1;
kw = demoKw;
}

const { kwStr, mwStr } = formatPair(kw);
if (isLiveValue) updateTrend(kw);
setRotorPower(kw);
if (isLiveValue) {
if (serverDayMax !== null) { if (kw > serverDayMax) drawDayMax(kw, Date.now()); else drawDayMax(serverDayMax, serverDayMaxTs); } // gemeinsamer Tageshoechstwert vom Server
else updateDayMax(kw); // Notfall: lokal, falls Server ihn nicht liefert
}
renderKwDigits(kwStr);
mwText.textContent = mwStr;

const nowMs = Date.now();
const elapsedHours = Math.max(0, (nowMs - lastTickMs) / 3600000);
lastTickMs = nowMs;
if (liveYieldMwh !== null) {
// Echter Gesamtertrag von clavis - wird direkt übernommen, nicht hochgezählt.
totalYieldMwh = liveYieldMwh;
} else if (kw > 0) {
// Kein Live-Wert vorhanden (z.B. Demo-Modus) - wie bisher simulieren.
totalYieldMwh += (kw / 1000) * elapsedHours;
}
renderYieldDigits(formatYield(totalYieldMwh));

const targetAngle = valueToAngle(kw / 1000);
updateLeds(kw / 1000);
currentAngle = targetAngle;
needleGroup.setAttribute('transform', 'translate(200,200) rotate(' + currentAngle.toFixed(1) + ')');
}

needleGroup.style.transition = 'transform 0.9s cubic-bezier(.34,1.4,.4,1)';
tick();
setInterval(tick, 2000);

if ('wakeLock' in navigator) {
document.body.addEventListener('click', async function requestWakeLock() {
try { await navigator.wakeLock.request('screen'); } catch (e) {}
}, { once: true });
}
})();
</script>

'/':['00001','00010','00010','00100','01000','01000','10000'],
' ':['00000','00000','00000','00000','00000','00000','00000'],
'm':['00000','00000','11010','10101','10101','10101','10101'],
's':['00000','00000','01111','10000','01110','00001','11110']
};
function renderDotText(container, text, opts) {
opts = opts || {};
const dot = opts.dot || 2.6, pitch = opts.pitch || 3.4, colGap = opts.colGap || 1.5;
const color = opts.color || '#ffb454';
while (container.firstChild) container.removeChild(container.firstChild);
let xCursor = 0;
for (let i = 0; i < text.length; i++) {
const glyph = FONT[text[i]] || FONT[' '];
for (let row = 0; row < 7; row++) {
const bits = glyph[row];
for (let col = 0; col < 5; col++) {
if (bits[col] === '1') {
const c = document.createElementNS(NS, 'circle');
c.setAttribute('cx', (xCursor + col * pitch).toFixed(2));
c.setAttribute('cy', (row * pitch).toFixed(2));
c.setAttribute('r', (dot / 2).toFixed(2));
c.setAttribute('fill', color);
container.appendChild(c);
}
}
}
xCursor += 5 * pitch + colGap * pitch;
}
return xCursor - colGap * pitch;
}
function setWindText(text) {
const svg = document.getElementById('windDotsSvg');
const g = document.getElementById('windDots');
if (!g || !svg) return;
const opts = { dot: 1.3, pitch: 2.45, colGap: 1.3, color: '#8dffe8' };
const tmp = document.createElementNS(NS, 'g');
const totalW = renderDotText(tmp, text, opts);
const totalH = 6 * opts.pitch;
svg.setAttribute('viewBox', '0 0 ' + (totalW + 4).toFixed(1) + ' ' + (totalH + 4).toFixed(1));
svg.setAttribute('width', (totalW + 4).toFixed(1));
svg.setAttribute('height', (totalH + 4).toFixed(1));
g.setAttribute('transform', 'translate(2,2)');
renderDotText(g, text, opts);
}
setWindText('6,4 m/s');
window.setWindText = setWindText;
})();
